version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - infra-owner
    groups:
      flutter:
        patterns:
          - "flutter*"
          - "firebase*"
        update-types:
          - "minor"
          - "patch"
      plugins:
        patterns:
          - "*"
        exclude-patterns:
          - "flutter*"
          - "firebase*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: monday
    labels:
      - "dependencies"
      - "ci"
    reviewers:
      - infra-owner