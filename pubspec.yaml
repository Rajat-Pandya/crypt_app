name: crypt_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ──
  firebase_core: ^2.30.0
  cloud_firestore: ^4.17.0
  firebase_auth: ^4.19.0
  firebase_messaging: ^14.9.0
  firebase_database: ^10.0.0
  firebase_app_check: ^0.2.1+18
  firebase_crashlytics: ^3.5.0
  firebase_analytics: ^10.10.0
  firebase_performance: ^0.9.4

  # ── Notifications ──
  flutter_local_notifications: ^17.0.0
  onesignal_flutter: ^5.0.4

  # ── Encryption ──
  encrypt: ^5.0.1
  pointycastle: ^3.7.3
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3

  # ── Networking ──
  http: ^1.2.0

  # ── Storage ──
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  firebase_storage: ^11.7.7

  # ── Image Picker ──
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # ── Audio & Haptics ──
  just_audio: ^0.9.40       # ✅ Message notification sound
  vibration: ^3.1.0         # ✅ Vibration support

  # ── UI & Utils ──
  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.5
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  connectivity_plus: ^6.0.0
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  
  # ── QR Code Generation & Scanning ──
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5

  # ── Emoji Picker ──
  emoji_picker_flutter: ^2.0.0

  # ── State Management ──
  flutter_bloc: ^8.1.6
  hydrated_bloc: ^9.1.5
  
  # ── Concurrency ──
  mutex: ^3.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  
  # ── Testing ──
  mocktail: ^1.0.0

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/sounds/message.mp3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
