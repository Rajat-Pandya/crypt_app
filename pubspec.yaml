name: crypt_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ──
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  firebase_database: ^12.6.0
  firebase_app_check: ^0.4.8
  firebase_crashlytics: ^5.4.0

  # ── Notifications ──
  flutter_local_notifications: ^17.0.0
  onesignal_flutter: ^5.7.0

  # ── Encryption ──
  encrypt: ^5.0.1
  pointycastle: ^3.7.3
  flutter_secure_storage: ^9.0.0

  # ── Networking ──
  http: ^1.2.0

  # ── Storage ──
  shared_preferences: ^2.2.2

  # ── Audio & Haptics ──
  just_audio: ^0.10.6       # ✅ Message notification sound
  vibration: ^3.2.1         # ✅ Vibration support

  # ── UI & Utils ──
  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.5
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter

  connectivity_plus: ^7.3.1

  # ── Emoji Picker ──
  emoji_picker_flutter: ^4.5.4

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/sounds/message.mp3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
